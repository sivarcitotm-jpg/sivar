# Netlify: sitio estático, se publica tal cual desde la raíz del repositorio (sin compilar)
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Las fotos de productos casi no cambian: el navegador las guarda una semana
[[headers]]
  for = "/productos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
